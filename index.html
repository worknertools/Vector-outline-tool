  <body>
  <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>描边轮廓复刻 Pro - Outline Studio Professional</title>
    <!-- 引入强大的图像处理引擎 OpenCV.js -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <style>
        :root { --line-color: #333; --bg-ui: #f0f0f0; }
        body { 
            background: var(--bg-ui); color: #333; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0; display: flex; width: 100vw; height: 100vh; overflow: hidden; 
            -webkit-font-smoothing: antialiased;
        }

        /* 跨浏览器重置原生样式，确保 Safari 和 Chrome 外观100%一致 */
        button, input, .file-input-container {
            -webkit-appearance: none;
            appearance: none;
            border-radius: 0;
            font-family: inherit;
        }

        .sidebar {
            width: 360px; height: 100vh; 
            background: #FDF2AB; 
            color: #333;
            display: flex; flex-direction: column; padding: 0; box-sizing: border-box;
            z-index: 10; flex-shrink: 0;
        }

        .sidebar-content {
            flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 20px;
            padding: 30px 25px; scrollbar-width: none; /* Firefox */
        }
        .sidebar-content::-webkit-scrollbar { display: none; /* Chrome & Safari */ }

        .panel { display: flex; flex-direction: column; gap: 20px; } 
        .ctrl { display: flex; flex-direction: column; gap: 8px; } 

        .ctrl label { 
            font-size: 11px; color: #777; display: flex; justify-content: space-between;
            align-items: center; text-transform: uppercase; letter-spacing: 1px;
        }

        .preview-box {
            width: 100%; height: 160px; background: #000000; 
            border: none; 
            box-sizing: border-box;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative; margin-bottom: 5px;
        }
        .preview-box span { font-size: 10px; color: #888; font-weight: bold; letter-spacing: 1px; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; display: none; }

        .ratio-wrapper { display: flex; gap: 10px; align-items: center; }
        .ratio-text { 
            cursor: pointer; font-size: 10px; opacity: 0.3; transition: opacity 0.2s; color: #000; font-weight: bold;
        }
        .ratio-text.active { opacity: 1; } 

        .file-input-wrapper {
            position: relative; display: flex; align-items: center; 
            background: #000; border: 1px solid #000;
            justify-content: center; box-sizing: border-box;
        }
        .file-input-container {
            padding: 12px; font-size: 11px; flex: 1; cursor: pointer; 
            color: #fff; text-align: center; text-transform: uppercase; font-weight: bold;
        }
        .clear-btn {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            color: #fff; cursor: pointer; font-size: 14px; font-weight: bold;
            padding: 5px; line-height: 1; display: none; transition: opacity 0.2s;
        }
        .clear-btn:hover { opacity: 0.6; }
        
        .toggle-group {
            display: flex; width: 100%; border: none; box-sizing: border-box; gap: 4px;
        }
        .toggle-btn {
            flex: 1; padding: 10px 0; font-size: 10px; font-weight: bold; cursor: pointer;
            background: #ffffff; color: #000; border: none; text-align: center; transition: all 0.2s;
        }
        .toggle-btn.active { background: #000; color: #fff; }

        .btn-white {
            background: #000; color: #fff; border: none; padding: 12px; 
            font-size: 10px; cursor: pointer; text-transform: uppercase;
            transition: opacity 0.2s; box-sizing: border-box; font-weight: bold;
        }
        .btn-white:hover { opacity: 0.8; }

        .btn-random {
            background: #ffffff; border: none; padding: 12px; color: #000;
            font-size: 10px; cursor: pointer; text-transform: uppercase;
            grid-column: 1 / 4; margin-top: 5px; box-sizing: border-box; font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn-random:hover { opacity: 0.8; }

        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 2px; margin: 4px 0 16px 0; outline: none;
            background: #ffffff; 
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #000; cursor: pointer; border: none;
        }
        input[type="range"]::-moz-range-thumb {
            width: 10px; height: 10px; border-radius: 50%; background: #000; cursor: pointer; border: none;
        }

        .color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
        
        .bg-ctrl-group { 
            display: flex; background: #fff; height: 24px; box-sizing: border-box;
            align-items: center; width: 100%; border: none; overflow: hidden;
        }
        .color-block { width: 30px; height: 100%; cursor: pointer; border-right: none; }
        
        .hex-display { 
            flex: 1; text-align: center; border: none; font-size: 10px; font-weight: bold;
            outline: none; background: transparent; min-width: 0; width: 100%;
        }

        .footer-text { 
            padding: 25px 0; text-align: center; 
            font-size: 9px; color: #bbb; letter-spacing: 1px;
        }

        .canvas-area { 
            flex: 1; background: #ffffff; display: flex; 
            align-items: center; justify-content: center; position: relative; overflow: hidden; 
        }
        
        canvas { background: #ffffff; }
        #upload { display: none; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-content">
        <div class="panel">
            <div class="ctrl">
                <div class="preview-box" id="previewBox">
                    <span id="previewPlaceholder">图像预览 PREVIEW</span>
                    <img id="previewImg" alt="preview">
                </div>

                <label>
                    1. 图像源 (IMAGE SOURCE)
                    <div class="ratio-wrapper">
                        <span class="ratio-text" data-ratio="3/4">3:4</span>
                        <span class="ratio-text active" data-ratio="full">满屏</span>
                    </div>
                </label>
                <div class="file-input-wrapper">
                    <div class="file-input-container" onclick="document.getElementById('upload').click()" id="fileNameDisplay">上传图片 UPLOAD</div>
                    <div class="clear-btn" id="clearImageBtn" onclick="clearImage(event)">✕</div>
                </div>
                <input type="file" id="upload" accept="image/png, image/jpeg, image/jpg">
            </div>

            <div class="ctrl">
                <label>
                    2. 调色盘 (PALETTE)
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="color" id="colorBase" value="#98FF98" style="display:none" oninput="updateColor('Base')">
                        <div id="blockBase" style="width: 14px; height: 14px; border-radius: 50%; background-color: #98FF98; cursor: pointer; border: 1px solid rgba(0,0,0,0.2);" onclick="event.preventDefault(); event.stopPropagation(); document.getElementById('colorBase').click()" title="更改图形底色"></div>
                        <div id="eyeIcon" style="cursor: pointer; width: 14px; height: 14px; display: flex; align-items: center; opacity: 0.3;" onclick="toggleBaseColor(event)" title="显示/隐藏底色">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        </div>
                    </div>
                </label>
                
                <div class="color-row" style="grid-template-columns: 1fr 1fr;">
                    <div class="ctrl">
                        <label>油墨 (INK)</label>
                        <div class="bg-ctrl-group">
                            <input type="color" id="colorInk" value="#1a1510" style="display:none" oninput="updateColor('Ink')">
                            <div id="blockInk" class="color-block" style="background-color: #1a1510;" onclick="document.getElementById('colorInk').click()"></div>
                            <input type="text" class="hex-display" id="hexInk" value="#1A1510" oninput="handleHexInput('Ink')">
                        </div>
                    </div>
                    <div class="ctrl">
                        <label>纸张 (PAPER)</label>
                        <div class="bg-ctrl-group">
                            <input type="color" id="colorPaper" value="#ffffff" style="display:none" oninput="updateColor('Paper')">
                            <div id="blockPaper" class="color-block" style="background-color: #ffffff;" onclick="document.getElementById('colorPaper').click()"></div>
                            <input type="text" class="hex-display" id="hexPaper" value="#FFFFFF" oninput="handleHexInput('Paper')">
                        </div>
                    </div>
                </div>
            </div>

            <div class="ctrl">
                <label>3. 风格选项 (STYLE OPTIONS)</label>
                <div class="toggle-group" id="styleToggle">
                    <button class="toggle-btn active" data-style="smooth">平滑 SMOOTH</button>
                    <button class="toggle-btn" data-style="pixel">像素 PIXEL</button>
                </div>

                <label style="margin-top: 8px;">图形阀值 THRESHOLD <span id="v-thresh">220</span></label>
                <input type="range" id="thresh" min="0" max="255" value="220">
                
                <label>线条粗细 THICKNESS <span id="v-thick">2</span></label>
                <input type="range" id="thick" min="1" max="30" value="2">
                
                <label><span id="blurLabelText">平滑处理 SMOOTH</span> <span id="v-blur">3</span></label>
                <input type="range" id="blur" min="1" max="15" step="2" value="3">

                <label>画面缩放 ZOOM <span id="v-zoom">1.0</span></label>
                <input type="range" id="zoom" min="0.5" max="2.0" step="0.05" value="1.0">
            </div>

            <div class="ctrl">
                <label>4. 导出 (EXPORT)</label>
                <div class="color-row" style="grid-template-columns: 1fr 1fr 1fr;">
                    <button class="btn-white" onclick="downloadImage('jpeg', this)">JPG</button>
                    <button class="btn-white" onclick="downloadImage('png', this)">PNG</button>
                    <button class="btn-white" onclick="downloadSVG(this)">SVG</button>
                    <button class="btn-random" onclick="randomPalette()">随机色彩</button>
                </div>
            </div>
        </div>
    </div>
    <div class="footer-text">2026 &copy;Design by Type Play Studio</div>
</div>

<div class="canvas-area" id="canvasArea">
    <canvas id="mainCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d', {willReadFrequently: true});
    let imgSource = null;
    let isCvReady = false;
    let currentImgUrl = null;
    let currentStyle = 'smooth';
    let currentOutlinePath = null;
    
    let showBaseColor = false;

    function onOpenCvReady() {
        if (typeof cv !== 'undefined' && cv.Mat) {
            isCvReady = true;
            if (imgSource) needsOutlineUpdate = true;
        } else if (typeof cv !== 'undefined') {
            cv['onRuntimeInitialized'] = () => {
                isCvReady = true;
                if (imgSource) needsOutlineUpdate = true;
            };
        }
    }

    let needsOutlineUpdate = false;
    let needsColorUpdate = false;
    let ratioMode = 'full'; 
    let currentRatio = 1; 

    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d', {willReadFrequently: true});

    function updateRangeFill(input) {
        const min = parseFloat(input.min) || 0;
        const max = parseFloat(input.max) || 100;
        const val = parseFloat(input.value) || 0;
        const percentage = ((val - min) / (max - min)) * 100;
        input.style.background = `linear-gradient(to right, #000 ${percentage}%, #ffffff ${percentage}%)`;
    }

    // 解决旧版浏览器的兼容forEach问题
    Array.prototype.forEach.call(document.querySelectorAll('input[type="range"]'), function(input) {
        updateRangeFill(input); 
        input.addEventListener('input', function() {
            const display = document.getElementById('v-' + input.id);
            if(display) display.innerText = input.value;
            updateRangeFill(input); 
            needsOutlineUpdate = true;
        });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.ratio-text'), function(btn) {
        btn.onclick = function() {
            Array.prototype.forEach.call(document.querySelectorAll('.ratio-text'), function(b) {
                b.classList.remove('active');
            });
            btn.classList.add('active');
            ratioMode = btn.dataset.ratio;
            resizeCanvas();
        };
    });

    Array.prototype.forEach.call(document.querySelectorAll('#styleToggle .toggle-btn'), function(btn) {
        btn.onclick = function() {
            Array.prototype.forEach.call(document.querySelectorAll('#styleToggle .toggle-btn'), function(b) {
                b.classList.remove('active');
            });
            btn.classList.add('active');
            currentStyle = btn.dataset.style;
            const blurLabel = document.getElementById('blurLabelText');
            if (blurLabel) {
                blurLabel.innerText = currentStyle === 'pixel' ? '像素大小 PIXEL SIZE' : '平滑处理 SMOOTH';
            }
            needsOutlineUpdate = true;
        };
    });

    document.getElementById('upload').onchange = function(e) {
        const file = e.target.files[0];
        if (file) {
            const img = new Image();
            img.onload = function() {
                imgSource = img;
                
                let fileName = file.name;
                const dotIdx = fileName.lastIndexOf('.');
                if (dotIdx > 0) fileName = fileName.substring(0, dotIdx);
                if (fileName.length > 8) fileName = fileName.substring(0, 8) + '...';
                
                document.getElementById('fileNameDisplay').innerText = fileName;
                document.getElementById('clearImageBtn').style.display = 'block';

                document.getElementById('previewPlaceholder').style.display = 'none';
                const previewImg = document.getElementById('previewImg');
                previewImg.style.display = 'block';
                previewImg.src = currentImgUrl;

                resizeCanvas();
                renderOutline();
                needsOutlineUpdate = false;
                renderColor();
                needsColorUpdate = false;
            };
            
            if (currentImgUrl) {
                URL.revokeObjectURL(currentImgUrl);
            }
            currentImgUrl = URL.createObjectURL(file);
            img.src = currentImgUrl;
        }
        e.target.value = '';
    };

    function clearImage(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation(); 
        }
        imgSource = null;
        document.getElementById('upload').value = '';
        
        document.getElementById('fileNameDisplay').innerText = '上传图片 UPLOAD';
        document.getElementById('clearImageBtn').style.display = 'none';
        
        document.getElementById('previewPlaceholder').style.display = 'block';
        const previewImg = document.getElementById('previewImg');
        previewImg.style.display = 'none';
        previewImg.src = '';
        
        if (currentImgUrl) {
            URL.revokeObjectURL(currentImgUrl);
            currentImgUrl = null;
        }
        
        needsOutlineUpdate = true; 
        renderOutline();
        needsOutlineUpdate = false;
        renderColor();
        needsColorUpdate = false;
    }

    function updateColor(type) {
        const val = document.getElementById('color' + type).value;
        const hexDisplay = document.getElementById('hex' + type);
        if (hexDisplay) {
            hexDisplay.value = val.toUpperCase();
        }
        document.getElementById('block' + type).style.backgroundColor = val;
        needsColorUpdate = true;
    }

    function handleHexInput(type) {
        let val = document.getElementById('hex' + type).value.trim();
        if (val.length > 0 && val[0] !== '#') val = '#' + val;
        
        let validHex = null;
        if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
            validHex = val;
        } else if (/^#[0-9A-Fa-f]{3}$/.test(val)) {
            validHex = '#' + val[1]+val[1] + val[2]+val[2] + val[3]+val[3];
        }

        if (validHex) {
            document.getElementById('color' + type).value = validHex;
            document.getElementById('block' + type).style.backgroundColor = validHex;
            needsColorUpdate = true;
        }
    }

    function toggleBaseColor(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }
        showBaseColor = !showBaseColor;
        const eye = document.getElementById('eyeIcon');
        if (showBaseColor) {
            eye.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
            eye.style.opacity = "0.8";
        } else {
            eye.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
            eye.style.opacity = "0.3";
        }
        needsColorUpdate = true;
    }

    function randomPalette() {
        let h = Math.floor(Math.random() * 360);
        let s = Math.floor(Math.random() * 40) + 60; 
        let l = Math.floor(Math.random() * 30) + 40; 

        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = function(n) {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                let hex = Math.round(255 * color).toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            };
            return '#' + f(0) + f(8) + f(4);
        }

        let color1 = hslToHex(h, s, l);
        let color2 = hslToHex((h + 180) % 360, s, l);

        document.getElementById('colorPaper').value = color1;
        updateColor('Paper');
        
        document.getElementById('colorBase').value = color2;
        updateColor('Base');
    }

    function resizeCanvas() {
        const area = document.getElementById('canvasArea');
        const padding = ratioMode === 'full' ? 0 : 60;
        const maxW = area.clientWidth - padding;
        const maxH = area.clientHeight - padding;
        
        if (ratioMode === 'full') {
            currentRatio = maxW / maxH;
        } else {
            const parts = ratioMode.split('/');
            currentRatio = parseFloat(parts[0]) / parseFloat(parts[1]);
        }

        let w = maxW; let h = w / currentRatio;
        if (h > maxH) { h = maxH; w = h * currentRatio; }

        canvas.style.width = Math.floor(w) + 'px';
        canvas.style.height = Math.floor(h) + 'px';
        needsOutlineUpdate = true;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function renderOutline() {
        if (!imgSource || !isCvReady) {
            currentOutlinePath = null;
            needsColorUpdate = true;
            return;
        }

        const h = 1200;
        const w = Math.floor(1200 * currentRatio);
        
        if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
        }

        const sRatio = imgSource.width / imgSource.height;
        const cRatio = w / h;
        let dw, dh, dx, dy;
        if(sRatio > cRatio) {
            dw = w; dh = Math.round(w / sRatio); dx = 0; dy = (h - dh) / 2;
        } else {
            dh = h; dw = Math.round(h * sRatio); dx = (w - dw) / 2; dy = 0;
        }

        offCanvas.width = dw;
        offCanvas.height = dh;
        offCtx.clearRect(0, 0, dw, dh);
        offCtx.drawImage(imgSource, 0, 0, dw, dh);

        let imgData = offCtx.getImageData(0, 0, dw, dh);
        let data = imgData.data;
        let hasTrans = false;
        for (let i = 3; i < data.length; i += 4) {
            if (data[i] < 255) { hasTrans = true; break; }
        }
        if (hasTrans) {
            for (let i = 0; i < data.length; i += 4) {
                let alpha = data[i+3] / 255;
                data[i]   = data[i]   * 0.75 * alpha + 255 * (1 - alpha);
                data[i+1] = data[i+1] * 0.75 * alpha + 255 * (1 - alpha);
                data[i+2] = data[i+2] * 0.75 * alpha + 255 * (1 - alpha);
                data[i+3] = 255; 
            }
            offCtx.putImageData(imgData, 0, 0);
        }

        let src = cv.imread(offCanvas);
        let gray = new cv.Mat();
        let blurred = new cv.Mat();
        let binary = new cv.Mat();
        let contours = new cv.MatVector();
        let hierarchy = new cv.Mat();

        try {
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);

            let blurSize = parseInt(document.getElementById('blur').value, 10);
            let threshValue = parseInt(document.getElementById('thresh').value, 10);
            threshValue = Math.min(threshValue, 254);

            if (currentStyle === 'pixel') {
                let pixelSize = blurSize * 2;
                let small = new cv.Mat();
                cv.resize(gray, small, new cv.Size(Math.max(1, Math.floor(gray.cols / pixelSize)), Math.max(1, Math.floor(gray.rows / pixelSize))), 0, 0, cv.INTER_LINEAR);
                cv.threshold(small, small, threshValue, 255, cv.THRESH_BINARY_INV);
                cv.resize(small, binary, new cv.Size(gray.cols, gray.rows), 0, 0, cv.INTER_NEAREST);
                small.delete();
            } else {
                if (blurSize % 2 === 0) blurSize += 1; 
                cv.GaussianBlur(gray, blurred, new cv.Size(blurSize, blurSize), 0, 0, cv.BORDER_DEFAULT);
                cv.threshold(blurred, binary, threshValue, 255, cv.THRESH_BINARY_INV);
            }

            cv.findContours(binary, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

            currentOutlinePath = new Path2D();
            for (let i = 0; i < contours.size(); i++) {
                let cnt = contours.get(i);
                let data = cnt.data32S;
                if (data.length >= 6) {
                    currentOutlinePath.moveTo(data[0], data[1]);
                    for (let j = 2; j < data.length; j += 2) {
                        currentOutlinePath.lineTo(data[j], data[j+1]);
                    }
                    currentOutlinePath.closePath();
                }
                cnt.delete();
            }

        } catch (err) {
            console.error("OpenCV Processing Error:", err);
        } finally {
            src.delete(); gray.delete(); blurred.delete(); binary.delete(); 
            if (contours) contours.delete();
            if (hierarchy) hierarchy.delete();
        }

        needsColorUpdate = true;
    }

    function renderColor() {
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        
        const inkColor = document.getElementById('colorInk').value;
        const paperColor = document.getElementById('colorPaper').value;
        const baseColor = document.getElementById('colorBase').value;

        if (!imgSource || !currentOutlinePath) {
            ctx.fillStyle = paperColor;
            ctx.fillRect(0, 0, w, h);
            return;
        }

        ctx.fillStyle = paperColor;
        ctx.fillRect(0, 0, w, h);
        
        const sRatio = imgSource.width / imgSource.height;
        const cRatio = w / h;
        let dw, dh, dx, dy;
        if(sRatio > cRatio) {
            dw = w; dh = Math.round(w / sRatio); dx = 0; dy = (h - dh) / 2;
        } else {
            dh = h; dw = Math.round(h * sRatio); dx = (w - dw) / 2; dy = 0;
        }

        const zoom = parseFloat(document.getElementById('zoom').value);
        let thickness = parseInt(document.getElementById('thick').value, 10);

        ctx.save();
        ctx.translate(w/2, h/2);
        ctx.scale(zoom, zoom); 
        ctx.translate(-w/2, -h/2);
        ctx.translate(dx, dy);

        if (showBaseColor) {
            ctx.fillStyle = baseColor;
            ctx.fill(currentOutlinePath, 'evenodd');
        }

        ctx.strokeStyle = inkColor;
        ctx.lineWidth = thickness;
        ctx.lineJoin = currentStyle === 'pixel' ? 'miter' : 'round';
        ctx.lineCap = currentStyle === 'pixel' ? 'square' : 'round';
        ctx.stroke(currentOutlinePath);

        ctx.restore();
    }

    function loop() {
        if (needsOutlineUpdate) {
            renderOutline();
            needsOutlineUpdate = false;
            needsColorUpdate = false; 
            renderColor();
        } else if (needsColorUpdate) {
            renderColor();
            needsColorUpdate = false;
        }
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function downloadSVG(btn) {
        const h = 1200;
        const w = Math.floor(1200 * currentRatio);
        
        const inkColor = document.getElementById('colorInk').value;
        const paperColor = document.getElementById('colorPaper').value;
        const baseColor = document.getElementById('colorBase').value;
        const thickness = parseInt(document.getElementById('thick').value, 10);
        const zoom = parseFloat(document.getElementById('zoom').value);

        let svgPaths = [];
        let dx = 0, dy = 0;

        if (imgSource && isCvReady) {
            const sRatio = imgSource.width / imgSource.height;
            const cRatio = w / h;
            let dw, dh;
            if(sRatio > cRatio) {
                dw = w; dh = Math.round(w / sRatio); dx = 0; dy = (h - dh) / 2;
            } else {
                dh = h; dw = Math.round(h * sRatio); dx = (w - dw) / 2; dy = 0;
            }

            const expOffCanvas = document.createElement('canvas');
            expOffCanvas.width = dw;
            expOffCanvas.height = dh;
            const expOffCtx = expOffCanvas.getContext('2d', {willReadFrequently: true});

            expOffCtx.clearRect(0, 0, dw, dh);
            expOffCtx.drawImage(imgSource, 0, 0, dw, dh);
            
            let imgDataSvg = expOffCtx.getImageData(0, 0, dw, dh);
            let dataSvg = imgDataSvg.data;
            let hasTransSvg = false;
            for (let i = 3; i < dataSvg.length; i += 4) {
                if (dataSvg[i] < 255) { hasTransSvg = true; break; }
            }
            if (hasTransSvg) {
                for (let i = 0; i < dataSvg.length; i += 4) {
                    let alpha = dataSvg[i+3] / 255;
                    dataSvg[i]   = dataSvg[i]   * 0.75 * alpha + 255 * (1 - alpha);
                    dataSvg[i+1] = dataSvg[i+1] * 0.75 * alpha + 255 * (1 - alpha);
                    dataSvg[i+2] = dataSvg[i+2] * 0.75 * alpha + 255 * (1 - alpha);
                    dataSvg[i+3] = 255;
                }
                expOffCtx.putImageData(imgDataSvg, 0, 0);
            }

            let src = cv.imread(expOffCanvas);
            let gray = new cv.Mat();
            let blurred = new cv.Mat();
            let binary = new cv.Mat();
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();

            try {
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
                
                let blurSize = parseInt(document.getElementById('blur').value, 10);
                let threshValue = parseInt(document.getElementById('thresh').value, 10);
                threshValue = Math.min(threshValue, 254);

                if (currentStyle === 'pixel') {
                    let pixelSize = blurSize * 2;
                    let small = new cv.Mat();
                    cv.resize(gray, small, new cv.Size(Math.max(1, Math.floor(gray.cols / pixelSize)), Math.max(1, Math.floor(gray.rows / pixelSize))), 0, 0, cv.INTER_LINEAR);
                    cv.threshold(small, small, threshValue, 255, cv.THRESH_BINARY_INV);
                    cv.resize(small, binary, new cv.Size(gray.cols, gray.rows), 0, 0, cv.INTER_NEAREST);
                    small.delete();
                } else {
                    if (blurSize % 2 === 0) blurSize += 1;
                    cv.GaussianBlur(gray, blurred, new cv.Size(blurSize, blurSize), 0, 0, cv.BORDER_DEFAULT);
                    cv.threshold(blurred, binary, threshValue, 255, cv.THRESH_BINARY_INV);
                }

                cv.findContours(binary, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

                for (let i = 0; i < contours.size(); i++) {
                    let contour = contours.get(i);
                    let data = contour.data32S; 
                    if (data.length >= 6) { 
                        let d = 'M' + data[0] + ',' + data[1];
                        for (let j = 2; j < data.length; j += 2) {
                            d += 'L' + data[j] + ',' + data[j+1];
                        }
                        d += 'Z';
                        svgPaths.push(d);
                    }
                    contour.delete();
                }
            } catch (err) {
                console.error(err);
            } finally {
                src.delete(); gray.delete(); blurred.delete(); binary.delete();
                if (contours) contours.delete(); 
                if (hierarchy) hierarchy.delete();
            }
        }

        let lineJoin = currentStyle === 'pixel' ? 'miter' : 'round';
        let lineCap = currentStyle === 'pixel' ? 'square' : 'round';

        let pathsStr = svgPaths.length > 0 
            ? '<g transform="translate(' + (w/2) + ', ' + (h/2) + ') scale(' + zoom + ') translate(' + (-w/2) + ', ' + (-h/2) + ') translate(' + dx + ', ' + dy + ')">' +
              '<path ' + (showBaseColor ? 'fill="' + baseColor + '" fill-rule="evenodd"' : 'fill="none"') + 
              ' stroke="' + inkColor + '" stroke-width="' + thickness + '" stroke-linejoin="' + lineJoin + '" stroke-linecap="' + lineCap + '" d="' + svgPaths.join('') + '" />' +
              '</g>' 
            : '';

        let svgStr = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '">' +
                     '<rect width="100%" height="100%" fill="' + paperColor + '" />' + pathsStr + '</svg>';

        const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
        const link = document.createElement('a');
        link.download = 'Outline_Art_Vector_' + Date.now() + '.svg';
        link.href = URL.createObjectURL(blob);
        
        // 兼容Safari挂载DOM模拟点击机制
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function() { URL.revokeObjectURL(link.href); }, 5000); 
    }

    function downloadImage(format, btn) {
        let expW, expH;
        if (currentRatio > 1) { 
            expW = 4960;
            expH = Math.floor(4960 / currentRatio);
        } else { 
            expH = 4960;
            expW = Math.floor(4960 * currentRatio);
        }

        const expCanvas = document.createElement('canvas');
        expCanvas.width = expW;
        expCanvas.height = expH;
        const expCtx = expCanvas.getContext('2d');

        const inkColor = document.getElementById('colorInk').value;
        const paperColor = document.getElementById('colorPaper').value;
        const baseColor = document.getElementById('colorBase').value;

        if (format === 'jpeg') {
            expCtx.fillStyle = paperColor;
            expCtx.fillRect(0, 0, expW, expH);
        } else {
            expCtx.clearRect(0, 0, expW, expH);
        }

        if (imgSource && isCvReady) {
            const scale = expH / 1200; 

            const sRatio = imgSource.width / imgSource.height;
            const cRatio = expW / expH;
            let dw, dh, dx, dy;
            if(sRatio > cRatio) {
                dw = expW; dh = Math.round(expW / sRatio); dx = 0; dy = (expH - dh) / 2;
            } else {
                dh = expH; dw = Math.round(expH * sRatio); dx = (expW - dw) / 2; dy = 0;
            }
            
            const expOffCanvas = document.createElement('canvas');
            expOffCanvas.width = dw;
            expOffCanvas.height = dh;
            const expOffCtx = expOffCanvas.getContext('2d', {willReadFrequently: true});

            expOffCtx.clearRect(0, 0, dw, dh);
            expOffCtx.drawImage(imgSource, 0, 0, dw, dh);
            
            let imgDataExp = expOffCtx.getImageData(0, 0, dw, dh);
            let dataExp = imgDataExp.data;
            let hasTransExp = false;
            for (let i = 3; i < dataExp.length; i += 4) {
                if (dataExp[i] < 255) { hasTransExp = true; break; }
            }
            if (hasTransExp) {
                for (let i = 0; i < dataExp.length; i += 4) {
                    let alpha = dataExp[i+3] / 255;
                    dataExp[i]   = dataExp[i]   * 0.75 * alpha + 255 * (1 - alpha);
                    dataExp[i+1] = dataExp[i+1] * 0.75 * alpha + 255 * (1 - alpha);
                    dataExp[i+2] = dataExp[i+2] * 0.75 * alpha + 255 * (1 - alpha);
                    dataExp[i+3] = 255;
                }
                expOffCtx.putImageData(imgDataExp, 0, 0);
            }

            let src = cv.imread(expOffCanvas);
            let gray = new cv.Mat();
            let blurred = new cv.Mat();
            let binary = new cv.Mat();
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();

            try {
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);

                let blurSize = Math.round(parseInt(document.getElementById('blur').value, 10) * scale);
                let threshValue = parseInt(document.getElementById('thresh').value, 10);
                threshValue = Math.min(threshValue, 254);

                if (currentStyle === 'pixel') {
                    let pixelSize = Math.max(1, blurSize * 2);
                    let small = new cv.Mat();
                    cv.resize(gray, small, new cv.Size(Math.max(1, Math.floor(gray.cols / pixelSize)), Math.max(1, Math.floor(gray.rows / pixelSize))), 0, 0, cv.INTER_LINEAR);
                    cv.threshold(small, small, threshValue, 255, cv.THRESH_BINARY_INV); 
                    cv.resize(small, binary, new cv.Size(gray.cols, gray.rows), 0, 0, cv.INTER_NEAREST);
                    small.delete();
                } else {
                    if (blurSize % 2 === 0) blurSize += 1;
                    cv.GaussianBlur(gray, blurred, new cv.Size(blurSize, blurSize), 0, 0, cv.BORDER_DEFAULT);
                    cv.threshold(blurred, binary, threshValue, 255, cv.THRESH_BINARY_INV); 
                }

                cv.findContours(binary, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

                let thickness = Math.max(1, Math.round(parseInt(document.getElementById('thick').value, 10) * scale));

                const zoom = parseFloat(document.getElementById('zoom').value);
                expCtx.save();
                expCtx.translate(expW/2, expH/2);
                expCtx.scale(zoom, zoom);
                expCtx.translate(-expW/2, -expH/2);
                expCtx.translate(dx, dy);

                expCtx.beginPath();
                for (let i = 0; i < contours.size(); i++) {
                    let cnt = contours.get(i);
                    let data = cnt.data32S;
                    if (data.length >= 6) {
                        expCtx.moveTo(data[0], data[1]);
                        for (let j = 2; j < data.length; j += 2) {
                            expCtx.lineTo(data[j], data[j+1]);
                        }
                        expCtx.closePath();
                    }
                    cnt.delete();
                }

                if (showBaseColor) {
                    expCtx.fillStyle = baseColor;
                    expCtx.fill('evenodd');
                }

                expCtx.strokeStyle = inkColor;
                expCtx.lineWidth = thickness;
                expCtx.lineJoin = currentStyle === 'pixel' ? 'miter' : 'round';
                expCtx.lineCap = currentStyle === 'pixel' ? 'square' : 'round';
                expCtx.stroke();
                
                expCtx.restore();

            } catch (err) {
                console.error("High-res Processing Error:", err);
            } finally {
                src.delete(); gray.delete(); blurred.delete(); binary.delete();
                if (contours) contours.delete();
                if (hierarchy) hierarchy.delete();
            }
        }

        expCanvas.toBlob(function(blob) {
            if (blob) {
                const link = document.createElement('a');
                link.download = 'Outline_Art_A3HD_' + Date.now() + '.' + (format === 'jpeg' ? 'jpg' : 'png');
                link.href = URL.createObjectURL(blob);
                
                // 兼容Safari挂载DOM模拟点击机制
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(function() { URL.revokeObjectURL(link.href); }, 5000); 
            }
        }, 'image/' + format, 1.0);
    }
